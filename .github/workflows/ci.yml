name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Aviso novo em dependência transitiva não pode travar um commit intocado:
      # o audit informa, mas não bloqueia o merge.
      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level low

      # `verify` termina no gate offline (`verify:offline`): é ele que sobe o
      # dist/standalone-server.mjs de verdade e confere cabeçalhos, ETag/304,
      # Range/If-Range, cache imutável e a divisão 404 x fallback do SPA, além
      # dos gates de sintaxe e de integridade de fonte. Ficaram anos fora do CI.
      - name: Verify release
        run: pnpm verify
