<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title-missions desc-missions">
  <title id="title-missions">TURNO XB</title><desc id="desc-missions">MISSÕES DIÁRIAS • PROGRESSO • RECOMPENSA</desc>
  
  <defs>
